<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris 3D — Escolher modo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      color: #f8fafc;
      background: radial-gradient(ellipse 120% 80% at 50% 0%, #4c1d95 0%, #312e81 28%, #1e1b4b 55%, #0f0728 100%);
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .mode-shell {
      width: min(980px, 100%);
      border: 1px solid rgba(167, 139, 250, 0.35);
      border-radius: 22px;
      background: linear-gradient(165deg, rgba(49, 46, 129, 0.9), rgba(2, 6, 23, 0.96));
      box-shadow: 0 0 38px rgba(76, 29, 149, 0.42);
      padding: clamp(18px, 3vw, 30px);
    }
    .mode-title {
      margin: 0 0 18px;
      text-align: center;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      line-height: 1.5;
      color: #e2e8f0;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
    }
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .mode-card {
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.72);
      border-radius: 18px;
      padding: 18px 18px 16px;
      cursor: pointer;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .mode-card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.75);
      box-shadow: 0 10px 28px rgba(2, 132, 199, 0.22);
    }
    .mode-card input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .mode-card__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .mode-name {
      font-weight: 800;
      font-size: 1.15rem;
      color: #f8fafc;
      letter-spacing: 0.01em;
    }
    .mode-desc {
      margin: 10px 0 0;
      font-size: 0.96rem;
      line-height: 1.42;
      color: #cbd5e1;
      max-width: 42ch;
    }
    .mode-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bfdbfe;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(125, 211, 252, 0.5);
      border-radius: 999px;
      padding: 6px 10px;
      white-space: nowrap;
    }
    .mode-card.active {
      border-color: rgba(34, 211, 238, 0.95);
      box-shadow:
        0 0 0 1px rgba(34, 211, 238, 0.4) inset,
        0 12px 34px rgba(8, 145, 178, 0.24);
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.9), rgba(17, 24, 39, 0.95));
    }
    .mode-card.active .mode-badge {
      border-color: rgba(34, 211, 238, 0.85);
      color: #67e8f9;
      background: rgba(8, 47, 73, 0.58);
    }
    .timer-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 18px;
    }
    .timer-btn {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.42);
      background: rgba(15, 23, 42, 0.76);
      color: #e2e8f0;
      cursor: pointer;
    }
    .timer-btn.active { border-color: #22d3ee; color: #67e8f9; }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      align-items: center;
    }
    .actions-spacer { flex: 1; min-width: 8px; }
    .primary {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      color: #0f172a;
      cursor: pointer;
    }
    .secondary {
      border: 1px solid rgba(148, 163, 184, 0.42);
      background: transparent;
      color: #cbd5e1;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
    }
    .secondary:hover {
      border-color: rgba(167, 139, 250, 0.55);
      background: rgba(30, 27, 75, 0.45);
      color: #f1f5f9;
    }
    .rankings-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      border: 1px solid rgba(251, 191, 36, 0.55);
      border-radius: 999px;
      padding: 10px 20px 10px 16px;
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fffbeb;
      cursor: pointer;
      background: linear-gradient(
        145deg,
        rgba(120, 53, 15, 0.92) 0%,
        rgba(69, 26, 3, 0.95) 45%,
        rgba(30, 20, 10, 0.98) 100%
      );
      box-shadow:
        0 0 22px rgba(251, 191, 36, 0.28),
        0 0 40px rgba(245, 158, 11, 0.12),
        inset 0 1px 0 rgba(254, 243, 199, 0.22);
      transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .rankings-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(253, 224, 71, 0.85);
      box-shadow:
        0 0 28px rgba(251, 191, 36, 0.42),
        0 0 48px rgba(245, 158, 11, 0.18),
        inset 0 1px 0 rgba(254, 243, 199, 0.35);
    }
    .rankings-btn:active {
      transform: translateY(0);
    }
    .rankings-btn__icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      opacity: 0.95;
      filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.65));
    }
  </style>
</head>
<body>
  <main class="mode-shell">
    <h1 class="mode-title">Seleciona o modo de jogo</h1>
    <section class="mode-grid" aria-label="Modos de jogo">
      <label class="mode-card active">
        <input type="radio" name="mode" value="normal" checked>
        <div class="mode-card__head">
          <span class="mode-name">Normal</span>
          <span class="mode-badge">Clássico</span>
        </div>
        <p class="mode-desc">
          Partida clássica sem limite de tempo. Ideal para jogar com calma e
          tentar bater o melhor score da sessão.
        </p>
      </label>
      <label class="mode-card">
        <input type="radio" name="mode" value="sprint">
        <div class="mode-card__head">
          <span class="mode-name">Sprint contra-relógio</span>
          <span class="mode-badge">Desafio</span>
        </div>
        <p class="mode-desc">
          Faz a melhor pontuação possível antes do tempo acabar. Escolhe a
          duração e joga no máximo ritmo.
        </p>
      </label>
    </section>
    <section id="timer-section" aria-label="Tempo da partida">
      <strong>Tempo:</strong>
      <div class="timer-row">
        <button type="button" class="timer-btn" data-seconds="60">1 min</button>
        <button type="button" class="timer-btn active" data-seconds="120">2 min</button>
        <button type="button" class="timer-btn" data-seconds="300">5 min</button>
      </div>
    </section>
    <div class="actions">
      <button type="button" id="back-btn" class="secondary">Voltar</button>
      <button type="button" id="rankings-btn" class="rankings-btn">
        <svg class="rankings-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 21h8"/><path d="M12 17v4"/><path d="M17 4h3v3a5 5 0 0 1-5 5h-1"/><path d="M7 4H4v3a5 5 0 0 0 5 5h1"/><path d="M8 4h8v4a4 4 0 0 1-8 0V4z"/>
        </svg>
        Ver rankings
      </button>
      <span class="actions-spacer" aria-hidden="true"></span>
      <button type="button" id="play-btn" class="primary">Jogar</button>
    </div>
  </main>

  <div id="modal-ranking-mode" class="game-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-ranking-mode-title">
    <div class="game-modal__panel game-modal__panel--wide game-modal__panel--ranking">
      <button type="button" class="game-modal__close" id="ranking-close-btn" aria-label="Fechar">&times;</button>
      <h2 id="modal-ranking-mode-title" class="game-modal__title">Rankings</h2>
      <p class="game-modal__placeholder ranking-modal-hint">Melhores pontuações neste dispositivo (todos os modos).</p>
      <div id="ranking-all-mode" class="ranking-all"></div>
    </div>
  </div>

  <script src="rankings.js"></script>
  <script>
    const timerSection = document.getElementById("timer-section");
    const modeInputs = Array.from(document.querySelectorAll('input[name="mode"]'));
    const timerBtns = Array.from(document.querySelectorAll(".timer-btn"));
    let selectedTimer = 120;

    function refreshTimerVisibility() {
      const mode = modeInputs.find((x) => x.checked)?.value || "normal";
      timerSection.hidden = mode !== "sprint";
      const cards = Array.from(document.querySelectorAll(".mode-card"));
      cards.forEach((card) => {
        const input = card.querySelector('input[name="mode"]');
        card.classList.toggle("active", !!input?.checked);
      });
    }
    modeInputs.forEach((el) => el.addEventListener("change", refreshTimerVisibility));
    timerBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedTimer = Number(btn.dataset.seconds) || 120;
        timerBtns.forEach((b) => b.classList.toggle("active", b === btn));
      });
    });

    const modalRanking = document.getElementById("modal-ranking-mode");
    const rankingRoot = document.getElementById("ranking-all-mode");

    function openRankingModal() {
      if (window.TetrisRankings && rankingRoot) {
        window.TetrisRankings.renderFull(rankingRoot);
      }
      if (modalRanking) {
        modalRanking.hidden = false;
        modalRanking.setAttribute("aria-hidden", "false");
      }
    }
    function closeRankingModal() {
      if (modalRanking) {
        modalRanking.hidden = true;
        modalRanking.setAttribute("aria-hidden", "true");
      }
    }

    document.getElementById("rankings-btn").addEventListener("click", openRankingModal);
    document.getElementById("ranking-close-btn").addEventListener("click", closeRankingModal);
    modalRanking.addEventListener("click", (e) => {
      if (e.target === modalRanking) closeRankingModal();
    });

    document.getElementById("back-btn").addEventListener("click", () => {
      window.location.href = "index.html";
    });
    document.getElementById("play-btn").addEventListener("click", () => {
      const mode = modeInputs.find((x) => x.checked)?.value || "normal";
      const target =
        mode === "sprint"
          ? `index.html?mode=sprint&duration=${selectedTimer}`
          : "index.html?mode=normal";
      window.location.href = target;
    });
    refreshTimerVisibility();

    window.addEventListener("keydown", (e) => {
      if (e.code === "Escape" && modalRanking && !modalRanking.hidden) {
        e.preventDefault();
        closeRankingModal();
      }
    });
  </script>
</body>
</html>
